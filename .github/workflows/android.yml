name: Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare optional private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
              echo 'All four ANDROID signing secrets must be set when a private keystore is supplied.' >&2
              exit 1
            }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/widelight-signing.p12"
            chmod 600 "$RUNNER_TEMP/widelight-signing.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/widelight-signing.p12" >> "$GITHUB_ENV"
          fi
      - name: Test, lint, and build release once
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --build-cache testDebugUnitTest lintDebug assembleRelease -PbuildNumber="$GITHUB_RUN_NUMBER"
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk "WideLight.apk"
          sha256sum "WideLight.apk" > "WideLight.apk.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-apk
          path: |
            WideLight.apk
            WideLight.apk.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/widelight-signing.p12"
  release:
    name: Publish release APK
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          asset="WideLight.apk"
          printf 'Automatic Android release build.\n\nCommit: %s\nBranch: %s\n\nInstall the attached APK. Signing defaults to the public development key unless private signing secrets are configured.\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          flags=(--latest=false --prerelease)
          if [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            flags=(--latest)
            latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
            if [[ "$latest_tag" =~ ^build-([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              flags=(--latest=false)
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" "$asset.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" "$asset.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "WideLight · build ${GITHUB_RUN_NUMBER}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
